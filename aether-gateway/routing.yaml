# F2.3: model alias -> ordered provider chain. See docs/design/routing-policy.md.
# Local dev / test default: two mock-provider instances on different
# ports, standing in for a real primary/fallback pair (PRD section 14 -
# real providers cannot be made to fail on command, so M2's failover
# proof is built and tested entirely against these).
providers:
  mock-primary:
    baseUrl: http://localhost:8082
  mock-fallback:
    baseUrl: http://localhost:8083
  # Phase 12 (M9): real providers, each a thin config pointing at one of
  # the ProviderAdapter implementations in gateway-providers (added with
  # zero changes to gateway-core or gateway-router - the hexagonal
  # boundary's payoff). `type` selects the adapter; `apiKeyEnvVar` names
  # an *environment variable* to read the real credential from, never
  # the credential itself (F9.2 - this file is safe to commit even with
  # these entries active). Uncomment and set the named env var to use:
  #
  # ollama-local:
  #   baseUrl: http://localhost:11434
  #   type: ollama
  #   # No apiKeyEnvVar: local Ollama has no built-in auth.
  #
  # groq-main:
  #   baseUrl: https://api.groq.com/openai/v1
  #   type: groq
  #   apiKeyEnvVar: GROQ_API_KEY
  #
  # gemini-main:
  #   baseUrl: https://generativelanguage.googleapis.com
  #   type: gemini
  #   apiKeyEnvVar: GEMINI_API_KEY
  #
  # anthropic-main:
  #   baseUrl: https://api.anthropic.com/v1
  #   type: anthropic
  #   apiKeyEnvVar: ANTHROPIC_API_KEY
  #
  # openai-main:
  #   baseUrl: https://api.openai.com/v1
  #   type: openai
  #   apiKeyEnvVar: OPENAI_API_KEY
  #
  # Anything speaking the OpenAI wire format - LiteLLM, vLLM, TGI, a
  # vendor's compatible endpoint - uses the generic type. Point baseUrl
  # at the proxy's own /v1 and it fans out from there.
  #
  # litellm-local:
  #   baseUrl: http://localhost:4000/v1
  #   type: openai-compatible
  #   apiKeyEnvVar: LITELLM_API_KEY
  #
  # openai-compatible-main:
  #   baseUrl: https://your-provider.example.com/v1
  #   type: openai-compatible
  #   apiKeyEnvVar: CUSTOM_PROVIDER_API_KEY

routes:
  - alias: mock
    chain:
      - provider: mock-primary
        model: mock
        weight: 100
      - provider: mock-fallback
        model: mock
    cache:
      enabled: true
      threshold: 0.94
      ttl: 6h
