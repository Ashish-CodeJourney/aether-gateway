server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: aether-gateway
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${GATEWAY_DB_URL:jdbc:postgresql://localhost:5432/aether}
    username: ${GATEWAY_DB_USER:postgres}
    password: ${GATEWAY_DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

aether:
  routing:
    config-path: ${ROUTING_CONFIG_PATH:routing.yaml}
  quota:
    assumed-max-output-tokens: ${AETHER_QUOTA_ASSUMED_MAX_OUTPUT_TOKENS:500}
  cache:
    onnx-resource-cache-dir: ${AETHER_CACHE_ONNX_RESOURCE_CACHE_DIR:/tmp/aether-onnx-cache}
    default-threshold: ${AETHER_CACHE_DEFAULT_THRESHOLD:0.94}
