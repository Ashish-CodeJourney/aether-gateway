# Price per 1,000,000 tokens for each (provider, model) pair; the model
# is the upstream model a route's chain member runs, not the route alias.
# Edit this file and apply it without a restart:
#   curl -X POST localhost:8080/admin/cost-model/reload -H "X-Aether-Admin-Key: ..."
# A missing or invalid file is rejected with 400 and the previous prices
# stay in force. Prices for "mock" are illustrative ($0.50/$1.50 per 1M,
# easy to check by hand); real providers' prices are from each vendor's
# published rates - check current pricing before relying on them.
models:
  - provider: mock-primary
    model: mock
    inputPricePerMillion: 0.50
    outputPricePerMillion: 1.50
  - provider: mock-fallback
    model: mock
    inputPricePerMillion: 0.50
    outputPricePerMillion: 1.50
  # Real providers, priced per each vendor's published rates at the time
  # of writing - check current pricing before relying on these numbers.
  - provider: gemini-main
    model: gemini-flash-latest
    inputPricePerMillion: 0.075
    outputPricePerMillion: 0.30
  - provider: openai
    model: gpt-4o-mini
    inputPricePerMillion: 0.15
    outputPricePerMillion: 0.60
  # Embedding models use the same entry shape: input price only, output
  # always 0 (an embedding has no completion tokens). Prices are
  # OpenAI's published rates; the provider name must match a provider
  # in routing.yaml (here the commented-out "openai-main" example).
  # /v1/embeddings looks an entry up by the chain member's upstream
  # model first, then by the route alias; unpriced models cost 0.
  - provider: openai-main
    model: text-embedding-3-small
    inputPricePerMillion: 0.02
    outputPricePerMillion: 0.0
  - provider: openai-main
    model: text-embedding-3-large
    inputPricePerMillion: 0.13
    outputPricePerMillion: 0.0
