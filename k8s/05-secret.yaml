# Dev/proof-test values only, matching docker-compose.yml's own inline
# dev credentials - never commit real secrets here. A real deployment
# replaces this with a Secret populated by a secrets manager / sealed-
# secrets / external-secrets-operator, not a plain committed manifest.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: aether-gateway
type: Opaque
stringData:
  GATEWAY_DB_PASSWORD: postgres
  AETHER_ADMIN_API_KEY: dev-admin-key-do-not-use-in-production
