# Dev/proof-test dependency, not a production Postgres deployment (no
# persistence, no HA, no backups) - the same scope docker-compose.yml's
# postgres service has, just running in-cluster so the gateway's own
# manifests can be proven under real orchestration (PRD section 17.2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aether-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          env:
            - name: POSTGRES_DB
              value: aether
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aether-gateway
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
