# F6.6: points Grafana at the committed dashboard JSON
# (docker/grafana/dashboards/aether-gateway.json) so it's provisioned
# automatically on startup, not hand-imported.
apiVersion: 1

providers:
  - name: aether-gateway
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
