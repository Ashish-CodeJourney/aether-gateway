name: CI

# Stages mirror the three-layer testing strategy (docs/adr/009-three-layer-testing-strategy.md):
# unit tests, integration tests (Testcontainers), and acceptance tests
# (Cucumber, black-box) run as three independent, parallel jobs (they
# don't depend on each other's Gradle state - each job does its own
# checkout/compile) rather than three sequential steps in one job, since
# running them one after another in a single job was the single biggest
# contributor to total CI wall-clock time. Everything downstream (image
# build/scan, Compose smoke test, push) waits on all three, and on the
# acceptance suite's second run against a lite-mode gateway (ADR-010). "Deploy on
# tag" (the final PRD 17.4 stage) is intentionally not implemented yet:
# it needs a live host, which Phase 01 task 6 (Oracle Cloud / Hetzner
# signup) has not completed and Phase 12 (M9) is where deployment is
# actually scoped. Adding a job with nothing real to deploy to would
# just be a placeholder pretending to work; that stage lands with M9
# instead.

on:
  push:
    branches: [trunk, main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "docs-site/**", "**/*.md"]
  pull_request:
    branches: [trunk, main]
    paths-ignore: ["docs/**", "docs-site/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # ArchUnit's hexagonal-boundary tests (ADR-009) live as plain
      # JUnit tests under gateway-core/src/test, so they run here too,
      # not as a separate stage.
      - name: Unit tests (incl. ArchUnit boundary checks)
        run: ./gradlew test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          retention-days: 7
          path: |
            aether-gateway/**/build/reports/tests/test/**
            aether-gateway/**/build/test-results/test/**

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: "Integration tests (Testcontainers: Postgres+pgvector, Redis; real ONNX embedding model)"
        run: ./gradlew integrationTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          retention-days: 7
          path: |
            aether-gateway/**/build/reports/tests/integrationTest/**
            aether-gateway/**/build/test-results/integrationTest/**

  acceptance-tests:
    name: Acceptance tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Runs the actual built boot jars as separate OS processes against
      # Testcontainers-managed infra (ADR-009), never against gateway
      # internals directly - see gateway-acceptance-tests/build.gradle.kts.
      - name: Acceptance tests (Cucumber, black-box HTTP only)
        run: ./gradlew :gateway-acceptance-tests:test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-test-reports
          retention-days: 7
          path: |
            aether-gateway/gateway-acceptance-tests/build/reports/tests/**
            aether-gateway/gateway-acceptance-tests/build/test-results/**

  # ADR-010: the same Cucumber suite against a lite-mode gateway (no
  # Postgres, no Redis), skipping scenarios that need the semantic cache.
  acceptance-tests-lite:
    name: Acceptance tests (lite mode)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Acceptance tests against a lite-mode gateway
        run: ./gradlew :gateway-acceptance-tests:acceptanceTestLite

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-test-lite-reports
          retention-days: 7
          path: |
            aether-gateway/gateway-acceptance-tests/build/reports/tests/acceptanceTestLite/**
            aether-gateway/gateway-acceptance-tests/build/test-results/acceptanceTestLite/**

  # gateway-proxy is built twice: the default (last) Dockerfile stage,
  # full mode, exactly as before, and the `lite` target (ADR-010),
  # published with a -lite tag suffix.
  docker-build-and-scan:
    name: Build and scan Docker images
    needs: [unit-tests, integration-tests, acceptance-tests, acceptance-tests-lite]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: gateway-proxy
            target: ""
            suffix: ""
          - service: gateway-proxy
            target: lite
            suffix: "-lite"
          - service: mock-provider
            target: ""
            suffix: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Writes every layer to the GitHub Actions cache so push-images can
      # reuse them instead of re-running the Gradle build, which re-downloads
      # all dependencies and has been rate-limited (HTTP 429) by Maven Central.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: aether-gateway/${{ matrix.service }}/Dockerfile
          target: ${{ matrix.target }}
          tags: aether-${{ matrix.service }}:${{ github.sha }}${{ matrix.suffix }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}${{ matrix.suffix }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aether-${{ matrix.service }}:${{ github.sha }}${{ matrix.suffix }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  compose-smoke-test:
    name: Docker Compose smoke test
    needs: docker-build-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build

      # First boot downloads the ~90MB ONNX embedding model, so allow up to
      # 5 minutes, but stop as soon as the gateway container exits rather
      # than waiting out the timeout on a startup crash.
      - name: Wait for gateway health
        run: |
          for i in $(seq 1 150); do
            if curl -sf http://localhost:8080/healthz > /dev/null; then
              exit 0
            fi
            if [ "$(docker compose ps --status running --services | grep -cx gateway)" = "0" ]; then
              echo "gateway container is no longer running" >&2
              exit 1
            fi
            sleep 2
          done
          echo "gateway did not become healthy within the timeout" >&2
          exit 1

      - name: Smoke test a chat completion through the full stack
        run: |
          curl -sf -X POST http://localhost:8080/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{"model": "mock", "messages": [{"role": "user", "content": "hi"}]}' \
            | tee /tmp/response.json
          grep -q '"object"' /tmp/response.json

      - name: Gateway logs (on failure)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 300 gateway

      - name: Full compose logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ADR-010: the lite image on its own - one `docker run`, no other
  # container - must serve a request and answer the repeat from cache.
  lite-smoke-test:
    name: Lite image smoke test
    needs: docker-build-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the lite image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: aether-gateway/gateway-proxy/Dockerfile
          target: lite
          tags: aether-gateway-proxy:lite-smoke
          load: true
          cache-from: type=gha,scope=gateway-proxy-lite

      - name: Start the lite container
        run: |
          docker run -d --name aether-lite -p 8080:8080 \
            -e AETHER_LITE_BOOTSTRAP_API_KEY=aeth_ci_smoke_key \
            aether-gateway-proxy:lite-smoke

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/healthz > /dev/null; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' aether-lite)" != "true" ]; then
              echo "lite container is no longer running" >&2
              exit 1
            fi
            sleep 2
          done
          echo "lite gateway did not become healthy within the timeout" >&2
          exit 1

      - name: Smoke test a chat completion and its cached repeat
        run: |
          request() {
            curl -sf -D - -o /tmp/body.json -X POST http://localhost:8080/v1/chat/completions \
              -H "Content-Type: application/json" -H "Authorization: Bearer aeth_ci_smoke_key" \
              -d '{"model": "echo", "messages": [{"role": "user", "content": "hi"}]}'
          }
          request | tee /tmp/first.headers
          grep -q '"Echo: hi"' /tmp/body.json
          grep -qi '^x-aether-cache: MISS' /tmp/first.headers
          request | tee /tmp/second.headers
          grep -qi '^x-aether-cache: EXACT_HIT' /tmp/second.headers
          curl -sf http://localhost:8080/actuator/info | grep -q '"mode":"lite"'

      - name: Gateway logs (on failure)
        if: failure()
        run: docker logs aether-lite

      - name: Tear down
        if: always()
        run: docker rm -f aether-lite

  push-images:
    name: Push images to Docker Hub
    needs: [compose-smoke-test, lite-smoke-test]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/trunk' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: gateway-proxy
            target: ""
            suffix: ""
          - service: gateway-proxy
            target: lite
            suffix: "-lite"
          - service: mock-provider
            target: ""
            suffix: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Release tags (v1.2.3) publish :1.2.3, :1.2 and :latest; trunk
      # publishes :edge. Every build is also tagged with its commit SHA.
      # The lite image gets the same tags with a -lite suffix, except that
      # a release publishes plain :lite rather than :latest-lite.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ashishvaghelaa/aether-${{ matrix.service }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ matrix.suffix == '' && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=lite,suffix=,enable=${{ matrix.suffix == '-lite' && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: aether-gateway/${{ matrix.service }}/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}${{ matrix.suffix }}
