name: CI

# Sequence per PRD section 17.4 / docs/plan/TESTING-STRATEGY.md section 5:
# build + unit tests -> integration tests (Testcontainers) -> acceptance
# tests (Cucumber, black-box) -> build and scan the images -> smoke-test
# the Compose stack -> push images. "Deploy on tag" (the final PRD 17.4
# stage) is intentionally not implemented yet: it needs a live host,
# which Phase 01 task 6 (Oracle Cloud / Hetzner signup) has not completed
# and Phase 12 (M9) is where deployment is actually scoped. Adding a job
# with nothing real to deploy to would just be a placeholder pretending
# to work; that stage lands with M9 instead.

on:
  push:
    branches: [trunk, main]
    tags: ["v*"]
  pull_request:
    branches: [trunk, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, integration, and acceptance tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # ArchUnit's hexagonal-boundary tests (ADR-009) live as plain
      # JUnit tests under gateway-core/src/test, so they run here too,
      # not as a separate stage.
      - name: Unit tests (incl. ArchUnit boundary checks)
        run: ./gradlew test

      - name: "Integration tests (Testcontainers: Postgres, Redis)"
        run: ./gradlew integrationTest

      # Runs the actual built boot jars as separate OS processes against
      # Testcontainers-managed infra (ADR-009), never against gateway
      # internals directly - see gateway-acceptance-tests/build.gradle.kts.
      - name: Acceptance tests (Cucumber, black-box HTTP only)
        run: ./gradlew :gateway-acceptance-tests:test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          retention-days: 7
          path: |
            aether-gateway/**/build/reports/tests/**
            aether-gateway/**/build/test-results/**

  docker-build-and-scan:
    name: Build and scan Docker images
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway-proxy, mock-provider]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: >
          docker build
          -f aether-gateway/${{ matrix.service }}/Dockerfile
          -t aether-${{ matrix.service }}:${{ github.sha }}
          .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aether-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  compose-smoke-test:
    name: Docker Compose smoke test
    needs: docker-build-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/healthz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "gateway did not become healthy within the timeout" >&2
          exit 1

      - name: Smoke test a chat completion through the full stack
        run: |
          curl -sf -X POST http://localhost:8080/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{"model": "mock", "messages": [{"role": "user", "content": "hi"}]}' \
            | tee /tmp/response.json
          grep -q '"object"' /tmp/response.json

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  push-images:
    name: Push images to GHCR
    needs: compose-smoke-test
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/trunk' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [gateway-proxy, mock-provider]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: aether-gateway/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aether-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/aether-${{ matrix.service }}:latest
