<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0b16"/>
      <stop offset="100%" stop-color="#1a1530"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CF0"/>
      <stop offset="100%" stop-color="#4F35AC"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ab9ff2"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Subtle radial glow -->
  <ellipse cx="300" cy="315" rx="500" ry="400" fill="rgba(110, 86, 207, 0.08)"/>

  <!-- Hexagon logo -->
  <g transform="translate(120, 245)">
    <!-- Outer hexagon -->
    <polygon points="50,0 100,29 100,87 50,116 0,87 0,29" fill="url(#accent-grad)"/>
    <!-- Inner hexagon -->
    <polygon points="50,20 82,39 82,77 50,96 18,77 18,39" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5"/>
    <!-- Center dot -->
    <circle cx="50" cy="58" r="6" fill="white"/>
  </g>

  <!-- Title -->
  <text x="260" y="310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="700" fill="url(#title-grad)" letter-spacing="-1">Aether Gateway</text>

  <!-- Tagline -->
  <text x="260" y="365" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#b3a9d6" font-weight="400">Self-hosted LLM gateway</text>

  <!-- Feature pills -->
  <g transform="translate(260, 400)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="rgba(110, 86, 207, 0.15)" stroke="rgba(139, 124, 240, 0.3)" stroke-width="1"/>
    <text x="90" y="22" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ab9ff2" text-anchor="middle" font-weight="500">Multi-provider failover</text>

    <rect x="195" y="0" width="170" height="34" rx="17" fill="rgba(110, 86, 207, 0.15)" stroke="rgba(139, 124, 240, 0.3)" stroke-width="1"/>
    <text x="280" y="22" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ab9ff2" text-anchor="middle" font-weight="500">Semantic caching</text>

    <rect x="380" y="0" width="150" height="34" rx="17" fill="rgba(110, 86, 207, 0.15)" stroke="rgba(139, 124, 240, 0.3)" stroke-width="1"/>
    <text x="455" y="22" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ab9ff2" text-anchor="middle" font-weight="500">Cost accounting</text>

    <rect x="545" y="0" width="140" height="34" rx="17" fill="rgba(110, 86, 207, 0.15)" stroke="rgba(139, 124, 240, 0.3)" stroke-width="1"/>
    <text x="615" y="22" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ab9ff2" text-anchor="middle" font-weight="500">Quota enforcement</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="url(#accent-grad)" opacity="0.6"/>
  <text x="600" y="616" font-family="monospace, 'Courier New', monospace" font-size="14" fill="rgba(255,255,255,0.7)" text-anchor="middle">github.com/Ashish-CodeJourney/aether-gateway</text>
</svg>
