name: aether-gateway

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-provider:
    build:
      context: .
      dockerfile: aether-gateway/mock-provider/Dockerfile
    ports:
      - "8081:8081"
    environment:
      MOCK_PROVIDER_PORT: "8081"

  gateway:
    build:
      context: .
      dockerfile: aether-gateway/gateway-proxy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GATEWAY_PORT: "8080"
      GATEWAY_DB_URL: jdbc:postgresql://postgres:5432/aether
      GATEWAY_DB_USER: postgres
      GATEWAY_DB_PASSWORD: postgres
      MOCK_PROVIDER_URL: http://mock-provider:8081
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-provider:
        condition: service_started
