name: aether-gateway

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Two mock-provider instances, standing in for a real primary/fallback
  # provider pair (PRD section 14: real providers cannot be made to fail
  # on command, so M2's routing/resilience behaviour is built and proven
  # entirely against these). See routing.docker.yaml.
  mock-primary:
    build:
      context: .
      dockerfile: aether-gateway/mock-provider/Dockerfile
    ports:
      - "8082:8081"
    environment:
      MOCK_PROVIDER_PORT: "8081"

  mock-fallback:
    build:
      context: .
      dockerfile: aether-gateway/mock-provider/Dockerfile
    ports:
      - "8083:8081"
    environment:
      MOCK_PROVIDER_PORT: "8081"

  gateway:
    build:
      context: .
      dockerfile: aether-gateway/gateway-proxy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GATEWAY_PORT: "8080"
      GATEWAY_DB_URL: jdbc:postgresql://postgres:5432/aether
      GATEWAY_DB_USER: postgres
      GATEWAY_DB_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      ROUTING_CONFIG_PATH: /config/routing.yaml
    volumes:
      - ./routing.docker.yaml:/config/routing.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-primary:
        condition: service_started
      mock-fallback:
        condition: service_started
