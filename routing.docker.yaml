# Same shape as routing.yaml (see docs/design/routing-policy.md), but
# using Docker Compose service DNS names instead of localhost ports,
# since the gateway and mock provider containers are not on the host
# network. Bind-mounted into the gateway container (see
# docker-compose.yml) rather than baked into the image, so it can be
# edited on the host and hot-reloaded via POST /admin/routes/reload
# without rebuilding anything (F2.7).
providers:
  mock-primary:
    baseUrl: http://mock-primary:8081
  mock-fallback:
    baseUrl: http://mock-fallback:8081
  gemini-main:
    baseUrl: https://generativelanguage.googleapis.com
    type: gemini
    apiKeyEnvVar: GEMINI_API_KEY
  # A real self-hosted LiteLLM proxy, which fans out to Ollama on a
  # Mac. It speaks the plain OpenAI wire format, so it needs no adapter
  # of its own - the generic one covers it, which is the whole point of
  # that type existing.
  litellm-nelkinda:
    baseUrl: https://ai.nelkinda.com/v1
    type: openai-compatible
    apiKeyEnvVar: LITELLM_API_KEY

routes:
  - alias: mock
    chain:
      - provider: mock-primary
        model: mock
        weight: 100
      - provider: mock-fallback
        model: mock
    cache:
      enabled: true
      threshold: 0.94
      ttl: 6h
  - alias: gemini
    chain:
      # gemini-flash-latest, not a pinned gemini-2.0-flash: this key's
      # free tier returns 429 with "limit: 0" for the 2.0 models.
      - provider: gemini-main
        model: gemini-flash-latest
    cache:
      enabled: true
      threshold: 0.94
      ttl: 6h
  # Two real, independent providers behind one alias: a self-hosted
  # LiteLLM/Ollama stack first, Gemini as the fallback. Unlike the mock
  # pair, neither of these can be made to fail on command - which makes
  # this the route that proves failover against providers nobody here
  # controls.
  - alias: local
    chain:
      - provider: litellm-nelkinda
        model: mac/gemma4:12b-mlx
      - provider: gemini-main
        model: gemini-flash-latest
    cache:
      enabled: true
      threshold: 0.94
      ttl: 6h
