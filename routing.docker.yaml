# Same shape as routing.yaml (see docs/design/routing-policy.md), but
# using Docker Compose service DNS names instead of localhost ports,
# since the gateway and mock provider containers are not on the host
# network. Bind-mounted into the gateway container (see
# docker-compose.yml) rather than baked into the image, so it can be
# edited on the host and hot-reloaded via POST /admin/routes/reload
# without rebuilding anything (F2.7).
providers:
  mock-primary:
    baseUrl: http://mock-primary:8081
  mock-fallback:
    baseUrl: http://mock-fallback:8081
  gemini-main:
    baseUrl: https://generativelanguage.googleapis.com
    type: gemini
    apiKeyEnvVar: GEMINI_API_KEY
  # Example OpenAI provider. Anything speaking the OpenAI wire format
  # (LiteLLM, vLLM, TGI, a vendor's compatible endpoint) works the same
  # way with `type: openai-compatible` and its own baseUrl. Set
  # OPENAI_API_KEY in your shell or a root .env file to use it.
  openai:
    baseUrl: https://api.openai.com/v1
    type: openai
    apiKeyEnvVar: OPENAI_API_KEY

routes:
  - alias: mock
    chain:
      - provider: mock-primary
        model: mock
        weight: 100
      - provider: mock-fallback
        model: mock
    cache:
      enabled: true
      threshold: 0.94
      ttl: 6h
  - alias: gemini
    chain:
      # gemini-flash-latest, not a pinned gemini-2.0-flash: this key's
      # free tier returns 429 with "limit: 0" for the 2.0 models.
      - provider: gemini-main
        model: gemini-flash-latest
    cache:
      enabled: true
      threshold: 0.94
      ttl: 6h
  # Two real, independent providers behind one alias: OpenAI first,
  # Gemini as the fallback. Example only - needs OPENAI_API_KEY and
  # GEMINI_API_KEY set.
  - alias: gpt
    chain:
      - provider: openai
        model: gpt-4o-mini
      - provider: gemini-main
        model: gemini-flash-latest
    cache:
      enabled: true
      threshold: 0.94
      ttl: 6h
